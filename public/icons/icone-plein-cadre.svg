<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5" />
      <stop offset="1" stop-color="#9333ea" />
    </linearGradient>
    <pattern id="damier" width="56" height="56" patternUnits="userSpaceOnUse" x="20" y="10">
      <rect width="56" height="56" fill="#ffffff" />
      <rect width="28" height="28" fill="#d6d3ff" />
      <rect x="28" y="28" width="28" height="28" fill="#d6d3ff" />
    </pattern>
    <clipPath id="silhouette">
      <circle cx="256" cy="186" r="78" />
      <path d="M100 428C100 342 170 292 256 292S412 342 412 428Z" />
    </clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#fond)" />
  <!-- Contenu réduit à ~72 % au centre : la « zone de sécurité » des icônes adaptatives -->
  <g transform="translate(256 256) scale(.72) translate(-256 -290)">
    <g clip-path="url(#silhouette)"><rect width="512" height="512" fill="url(#damier)" /></g>
    <g fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-dasharray="1 20" opacity=".95">
      <circle cx="256" cy="186" r="96" />
      <path d="M84 446C84 334 160 274 256 274S428 334 428 446" />
    </g>
  </g>
